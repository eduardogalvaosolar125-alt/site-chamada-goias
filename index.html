<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goiás EC | Chamada das turmas</title><link rel="stylesheet" href="styles.css"></head>
<body><header><div class="brand"><div class="crest">G</div><div><strong>GOIÁS ESPORTE CLUBE</strong><span>Chamada das turmas de voleibol</span></div></div><button id="logout" class="ghost">Sair</button></header><main>
<section id="login" class="login card"><div class="crest big">G</div><h1>Chamada das turmas</h1><p>Acesso de professores e coordenação</p><form id="loginForm"><label>E-mail<input required type="email" value="professor@goias.com.br"></label><label>Senha<input required type="password" value="123456"></label><button>Entrar</button></form><small>Protótipo: os dados ficam salvos neste navegador.</small></section>
<section id="app" class="hidden"><div class="welcome"><div><p>PAINEL DO PROFESSOR</p><h1>Olá, Professor!</h1><span id="today"></span></div><button id="newStudent">+ Adicionar atleta</button></div><div class="stats"><article><span>Turmas</span><b id="classCount">0</b></article><article><span>Presentes</span><b id="presentCount">0</b></article><article><span>Ausentes</span><b id="absentCount">0</b></article><article><span>Chamada</span><b id="progress">0%</b></article></div><div class="layout"><aside class="card"><h2>Turmas</h2><input id="classSearch" placeholder="Buscar turma ou professor..."><div id="classList"></div></aside><section class="card attendance"><div class="sectionHead"><div><p id="classMeta"></p><h2 id="classTitle"></h2></div><button id="allPresent" class="secondary">Marcar todos presentes</button></div><div class="toolbar"><input id="search" placeholder="Buscar atleta..."><select id="filter"><option value="all">Todos</option><option value="pending">Pendentes</option><option value="present">Presentes</option><option value="late">Atrasados</option><option value="absent">Ausentes</option><option value="excused">Justificados</option></select></div><div id="studentList"></div><div class="actions"><button id="save">Salvar chamada</button></div></section></div></section></main>
<dialog id="studentDialog"><form method="dialog" id="studentForm"><h2>Novo atleta</h2><label>Nome completo<input id="studentName" required></label><div><button value="cancel" class="ghost">Cancelar</button><button value="default">Adicionar</button></div></form></dialog><div id="toast"></div><script src="app.js"></script></body></html>
